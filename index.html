<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#151036">
<meta name="description" content="Ghostmarks: Tic Tac Toe XO where your oldest mark vanishes. Daily puzzle, 3x3 and 5x5 boards, play the computer or a friend.">
<title>Ghostmarks: Tic Tac Toe XO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.13); --text:#eef0ff; --muted:#a6abd6;
  --x:#4de1ff; --o:#ffb35c; --win:#7dffb2; --glowx:rgba(77,225,255,.65); --glowo:rgba(255,179,92,.65);
  --sheet:#1d1748; --accent1:#6f5cff; --accent2:#2db7e8;
  --bgimg: radial-gradient(1100px 700px at 15% -10%,#2c2073 0%,transparent 60%),
           radial-gradient(900px 700px at 100% 110%,#0f4a63 0%,transparent 55%),
           linear-gradient(160deg,#0e1030,#1b1347);
}
body[data-theme="paper"]{
  --card:rgba(0,0,0,.045); --line:rgba(0,0,0,.14); --text:#26252f; --muted:#6b6878;
  --x:#1f63d6; --o:#d9480f; --win:#2f9e44; --glowx:rgba(31,99,214,.25); --glowo:rgba(217,72,15,.25);
  --sheet:#fbf7ee; --accent1:#3b5bdb; --accent2:#1c7ed6;
  --bgimg: linear-gradient(160deg,#fbf7ee,#ece3cf);
}
body[data-theme="sunset"]{
  --x:#ff6fae; --o:#ffd166; --win:#9cffd0; --glowx:rgba(255,111,174,.6); --glowo:rgba(255,209,102,.6);
  --sheet:#3a1640; --accent1:#e8457c; --accent2:#f08c3a;
  --bgimg: radial-gradient(900px 600px at 80% -10%,#ff8a5c55 0%,transparent 60%), linear-gradient(165deg,#24102f,#5e2350 55%,#a3453d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);min-height:100dvh;display:flex;justify-content:center;background:var(--bgimg);background-attachment:fixed;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{width:100%;max-width:560px;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.7rem;letter-spacing:.5px;font-weight:800;
  background:linear-gradient(90deg,var(--x),#a78bff 55%,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.hbtns{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.daily{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;color:var(--text);text-align:left;font:inherit;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent1) 28%,transparent),color-mix(in srgb,var(--accent2) 22%,transparent))}
.daily .big{font-size:1.6rem}
.daily .t{font-weight:800;font-size:1.05rem}
.daily .s{color:var(--muted);font-size:.86rem;margin-top:2px}
.field label{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 4px;border-radius:9px;font-weight:600;font-size:.92rem;font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.hint{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.05rem;font-family:inherit;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));box-shadow:0 8px 24px color-mix(in srgb,var(--accent1) 35%,transparent)}
.btn.secondary{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--text);font-weight:600;font-size:.95rem;padding:11px 16px}
.btn:active{transform:translateY(1px)}
.scorebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px;text-align:center;transition:box-shadow .2s,border-color .2s}
.tile .nm{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .sc{font-size:1.5rem;font-weight:800}
.tile.x .sc{color:var(--x)} .tile.o .sc{color:var(--o)}
.tile.active.x{border-color:var(--x);box-shadow:0 0 18px var(--glowx)}
.tile.active.o{border-color:var(--o);box-shadow:0 0 18px var(--glowo)}
#status{text-align:center;font-weight:700;font-size:1.1rem;min-height:1.6em}
#streak,#legend{text-align:center;color:var(--muted);font-size:.84rem;min-height:1.2em}
#board{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:var(--gap,10px);width:min(100%,58vh,480px);margin:0 auto;aspect-ratio:1}
.cell{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0;cursor:pointer;min-width:0;aspect-ratio:1;color:inherit}
.cell:hover:not(.filled){background:color-mix(in srgb,var(--text) 12%,transparent)}
.cell:focus-visible{outline:3px solid #a78bff;outline-offset:2px}
.cell svg{position:absolute;inset:12%;width:76%;height:76%;overflow:visible;pointer-events:none}
.mark{fill:none;stroke-width:11;stroke-linecap:round}
.mx{stroke:var(--x);filter:drop-shadow(0 0 6px var(--glowx))}
.mo{stroke:var(--o);filter:drop-shadow(0 0 6px var(--glowo))}
.cell.pop .mark{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s ease-out forwards}
.cell.pop .mark:nth-child(2){animation-delay:.1s}
@keyframes draw{to{stroke-dashoffset:0}}
.cell.fading svg{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.3}}
.cell.out svg{animation:out .38s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(.55) rotate(-10deg)}}
.cell.win{border-color:var(--win);box-shadow:0 0 0 2px var(--win),0 0 26px color-mix(in srgb,var(--win) 45%,transparent);animation:wp .8s ease-in-out 3}
@keyframes wp{50%{transform:scale(1.06)}}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(5,4,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--sheet);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:86dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sheet h2{margin:0;font-size:1.25rem}
.sheet p,.sheet li{line-height:1.5;color:var(--text);margin:0}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table.lv{width:100%;border-collapse:collapse;font-size:.92rem}
table.lv th,table.lv td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.lv th:first-child,table.lv td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.35)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.cell.pop .mark,.cell.fading svg,.cell.out svg,.cell.win{animation:none!important}.cell.pop .mark{stroke-dashoffset:0}}
</style>

<body>
<main id="app">
  <header>
    <div><h1>Ghostmarks</h1><div class="subtitle">Tic Tac Toe · XO</div></div>
    <div class="hbtns">
      <button class="icon-btn" id="helpBtn" aria-label="How to play" title="How to play">?</button>
      <button class="icon-btn" id="statsBtn" aria-label="Statistics" title="Statistics">📊</button>
      <button class="icon-btn" id="muteBtn" aria-label="Toggle sound" title="Sound on/off">🔊</button>
    </div>
  </header>

  <section id="menu">
    <div style="display:flex;flex-direction:column;gap:14px">
      <button class="daily" id="dailyBtn" type="button">
        <span class="big">🗓️</span>
        <span><span class="t">Daily Puzzle</span><span class="s" id="dailySub" style="display:block"></span></span>
      </button>
      <div class="panel">
        <div class="field"><label>Board</label>
          <div class="seg" data-key="size">
            <button type="button" data-val="3">3 × 3</button>
            <button type="button" data-val="5">5 × 5</button>
          </div>
        </div>
        <div class="field"><label>Mode</label>
          <div class="seg" data-key="ghost">
            <button type="button" data-val="false">Classic</button>
            <button type="button" data-val="true">Ghost (vanishing)</button>
          </div>
        </div>
        <div class="field"><label>Opponent</label>
          <div class="seg" data-key="opp">
            <button type="button" data-val="cpu">Computer</button>
            <button type="button" data-val="two">2 Players</button>
          </div>
        </div>
        <div class="field" id="levelField"><label>Difficulty</label>
          <div class="seg" data-key="level">
            <button type="button" data-val="easy">Easy</button>
            <button type="button" data-val="normal">Normal</button>
            <button type="button" data-val="hard">Hard</button>
          </div>
        </div>
        <p class="hint" id="rules"></p>
        <button class="btn" id="startBtn" type="button">Play</button>
      </div>
      <div class="panel">
        <div class="field"><label>Theme</label>
          <div class="seg" id="themeSeg">
            <button type="button" data-theme="neon">Neon</button>
            <button type="button" data-theme="paper">Paper</button>
            <button type="button" data-theme="sunset">Sunset</button>
          </div>
        </div>
        <p class="hint" id="themeHint"></p>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="scorebar" id="scorebar">
        <div class="tile x" id="tileX"><div class="nm" id="nmX">X</div><div class="sc" id="scX">0</div></div>
        <div class="tile" id="tileD"><div class="nm">Draws</div><div class="sc" id="scD">0</div></div>
        <div class="tile o" id="tileO"><div class="nm" id="nmO">O</div><div class="sc" id="scO">0</div></div>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="board" role="group" aria-label="Game board"></div>
      <div id="legend"></div>
      <div id="streak"></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button" hidden>Play again</button>
        <button class="btn" id="shareBtn" type="button" hidden>Share</button>
        <button class="btn secondary" id="restartBtn" type="button">Restart</button>
        <button class="btn secondary" id="menuBtn" type="button">Menu</button>
      </div>
    </div>
  </section>
  <noscript><p class="hint">Ghostmarks needs JavaScript to run.</p></noscript>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn" id="modalClose" type="button">OK</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   Ghostmarks: original code. No external libraries, images, fonts or audio files.
   PORTAL / APP HOOKS: define window.GhostmarksPortal BEFORE this script runs to
   connect a portal SDK or mobile ads. Hooks: onGameStart(info), onGameEnd(info),
   onMute(muted). Show ads only at natural breaks (after a game ends), never mid-game.
   ===================================================================== */

// ==ENGINE START==
var DIRS = [[0,1],[1,0],[1,1],[1,-1]];
var WEIGHT = [0,1,8,64,512,4096,32768];
var WIN_SCORE = 100000;
var _orderCache = {};
function nowMs(){ return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }

function createState(size, winLen, maxMarks){
  return { size:size, winLen:winLen, maxMarks:maxMarks, board:new Array(size*size).fill(0), q:[[],[]], turn:1 };
}
function cloneState(s){
  return { size:s.size, winLen:s.winLen, maxMarks:s.maxMarks, board:s.board.slice(), q:[s.q[0].slice(), s.q[1].slice()], turn:s.turn };
}
function emptyCells(s){ var r=[]; for(var i=0;i<s.board.length;i++) if(!s.board[i]) r.push(i); return r; }

/* Places a mark for s.turn. If the player exceeds maxMarks, their oldest mark vanishes.
   Returns the index of the vanished cell, or -1. Does not change s.turn. */
function doMove(s, idx){
  var p=s.turn, qi=p-1;
  s.board[idx]=p; s.q[qi].push(idx);
  var removed=-1;
  if(s.q[qi].length > s.maxMarks){ removed=s.q[qi].shift(); s.board[removed]=0; }
  return removed;
}
function undoMove(s, idx, removed){
  var p=s.turn, qi=p-1;
  if(removed>=0){ s.board[removed]=p; s.q[qi].unshift(removed); }
  s.q[qi].pop(); s.board[idx]=0;
}
/* Returns the winning line (array of cell indexes) through idx for player p, or null. */
function winLine(s, idx, p){
  var n=s.size, w=s.winLen, r0=(idx/n)|0, c0=idx%n;
  for(var di=0; di<DIRS.length; di++){
    var d=DIRS[di], line=[idx], k, r, c;
    for(k=1;;k++){ r=r0+d[0]*k; c=c0+d[1]*k; if(r<0||r>=n||c<0||c>=n||s.board[r*n+c]!==p) break; line.push(r*n+c); }
    for(k=1;;k++){ r=r0-d[0]*k; c=c0-d[1]*k; if(r<0||r>=n||c<0||c>=n||s.board[r*n+c]!==p) break; line.push(r*n+c); }
    if(line.length>=w) return line;
  }
  return null;
}
function wouldWin(s, m, p){
  var t=s.turn; s.turn=p;
  var removed=doMove(s,m), w=!!winLine(s,m,p);
  undoMove(s,m,removed); s.turn=t;
  return w;
}
function immediateWins(s, p){
  var e=emptyCells(s), r=[];
  for(var i=0;i<e.length;i++) if(wouldWin(s,e[i],p)) r.push(e[i]);
  return r;
}
function getOrder(n){
  if(_orderCache[n]) return _orderCache[n];
  var a=[], mid=(n-1)/2, i;
  for(i=0;i<n*n;i++) a.push(i);
  a.sort(function(x,y){
    var dx=Math.abs((x/n|0)-mid)+Math.abs(x%n-mid), dy=Math.abs((y/n|0)-mid)+Math.abs(y%n-mid);
    return dx-dy;
  });
  return (_orderCache[n]=a);
}
function evaluate(s, me){
  var n=s.size, w=s.winLen, b=s.board, sc=0;
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) for(var di=0;di<4;di++){
    var d=DIRS[di], er=r+d[0]*(w-1), ec=c+d[1]*(w-1);
    if(er<0||er>=n||ec<0||ec>=n) continue;
    var a=0,o=0;
    for(var k=0;k<w;k++){ var v=b[(r+d[0]*k)*n+c+d[1]*k]; if(v===me) a++; else if(v) o++; }
    if(a&&o) continue;
    if(a) sc+=WEIGHT[a]; else if(o) sc-=WEIGHT[o];
  }
  return sc;
}

var _deadline=0, _aborted=false, _nodes=0;
function search(s, depth, alpha, beta, me, ply){
  if((++_nodes & 1023)===0 && nowMs()>_deadline) _aborted=true;
  if(_aborted) return 0;
  var p=s.turn, order=getOrder(s.size), maxing=(p===me);
  var best=maxing?-Infinity:Infinity, any=false;
  for(var oi=0; oi<order.length; oi++){
    var m=order[oi]; if(s.board[m]) continue;
    any=true;
    var removed=doMove(s,m), val;
    if(winLine(s,m,p)) val=(maxing?1:-1)*(WIN_SCORE-ply);
    else if(depth<=1) val=evaluate(s,me);
    else { s.turn=3-p; val=search(s,depth-1,alpha,beta,me,ply+1); s.turn=p; }
    undoMove(s,m,removed);
    if(_aborted) return 0;
    if(maxing){ if(val>best) best=val; if(best>alpha) alpha=best; }
    else { if(val<best) best=val; if(best<beta) beta=best; }
    if(alpha>=beta) break;
  }
  return any?best:0;
}
function rootValue(s, m, depth, alpha, me){
  var p=s.turn, removed=doMove(s,m), val;
  if(winLine(s,m,p)) val=WIN_SCORE;
  else if(depth<=1) val=evaluate(s,me);
  else { s.turn=3-p; val=search(s,depth-1,alpha,Infinity,me,1); s.turn=p; }
  undoMove(s,m,removed);
  return val;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* Hard: iterative-deepening minimax with alpha-beta and a time budget. */
function hardMove(s, maxDepth, ms){
  var me=s.turn, order=getOrder(s.size), empties=order.filter(function(i){return !s.board[i];});
  var chosen=[empties[0]];
  _deadline=nowMs()+ms;
  for(var depth=1; depth<=maxDepth; depth++){
    _aborted=false; _nodes=0;
    var bestVal=-Infinity, cur=[];
    for(var i=0;i<empties.length;i++){
      var m=empties[i];
      var alpha=(bestVal===-Infinity)?-Infinity:bestVal-1;
      var val=rootValue(s,m,depth,alpha,me);
      if(_aborted) break;
      if(val>bestVal){ bestVal=val; cur=[m]; } else if(val===bestVal){ cur.push(m); }
    }
    if(_aborted) break;
    chosen=cur;
    if(bestVal>=WIN_SCORE-50) break;           // forced win found
  }
  return pick(chosen);
}
function normalMove(s){
  var me=s.turn, opp=3-me, e=emptyCells(s), i;
  for(i=0;i<e.length;i++) if(wouldWin(s,e[i],me)) return e[i];
  if(Math.random()<0.85) for(i=0;i<e.length;i++) if(wouldWin(s,e[i],opp)) return e[i];
  var order=getOrder(s.size).filter(function(x){return !s.board[x];});
  return Math.random()<0.5 ? order[0] : pick(e);
}
function easyMove(s){
  var me=s.turn, e=emptyCells(s);
  if(Math.random()<0.2) for(var i=0;i<e.length;i++) if(wouldWin(s,e[i],me)) return e[i];
  return pick(e);
}
/* Defender used in the daily puzzle: win if possible, otherwise block, otherwise search. */
function defendMove(s){
  var me=s.turn, w=immediateWins(s,me); if(w.length) return w[0];
  var b=immediateWins(s,3-me); if(b.length) return b[0];
  return hardMove(s, s.size===3?10:6, 350);
}
function chooseMove(s, level){
  if(level==='easy') return easyMove(s);
  if(level==='normal') return normalMove(s);
  if(level==='defend') return defendMove(s);
  var ghost = s.maxMarks!==Infinity;
  var maxDepth = s.size===3 ? (ghost?10:9) : 8;
  return hardMove(s, maxDepth, 450);
}

/* ---------- Daily puzzle: X to move, wins in exactly 2 moves against any defence ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedFrom(str){ var h=2166136261>>>0; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
/* X first moves after which every O reply leaves X an immediate win (and O cannot win). */
function win2Moves(s){
  var res=[], e=emptyCells(s);
  for(var i=0;i<e.length;i++){
    var m=e[i]; s.turn=1;
    var r=doMove(s,m), ok=true;
    if(winLine(s,m,1)) ok=false;
    else {
      s.turn=2;
      var eo=emptyCells(s);
      if(!eo.length) ok=false;
      for(var j=0; ok && j<eo.length; j++){
        var o=eo[j], r2=doMove(s,o);
        if(winLine(s,o,2)) ok=false;
        else { s.turn=1; if(!immediateWins(s,1).length) ok=false; s.turn=2; }
        undoMove(s,o,r2);
      }
    }
    s.turn=1; undoMove(s,m,r);
    if(ok) res.push(m);
  }
  return res;
}
var DAILY_VARIANTS=[{size:3,ghost:false},{size:3,ghost:true},{size:5,ghost:false}];
function makeDaily(dateStr){
  var seed=seedFrom('ghostmarks:'+dateStr), rng=mulberry32(seed), start=seed%DAILY_VARIANTS.length;
  for(var vi=0; vi<DAILY_VARIANTS.length; vi++){
    var v=DAILY_VARIANTS[(start+vi)%DAILY_VARIANTS.length];
    var size=v.size, winLen=size===3?3:4, maxMarks=v.ghost?(size===3?3:5):Infinity;
    for(var attempt=0; attempt<(size===3?3000:600); attempt++){
      var s=createState(size,winLen,maxMarks), k;
      if(size===3) k = v.ghost ? 6+2*Math.floor(rng()*3) : 4;
      else k = 8+2*Math.floor(rng()*3);
      var bad=false;
      for(var mv=0; mv<k; mv++){
        var e=emptyCells(s), m=e[Math.floor(rng()*e.length)];
        doMove(s,m);
        if(winLine(s,m,s.turn)){ bad=true; break; }
        s.turn=3-s.turn;
      }
      if(bad) continue;
      s.turn=1;
      if(immediateWins(s,1).length || immediateWins(s,2).length) continue;
      var sol=win2Moves(s);
      if(sol.length>=1 && sol.length<=2){ s.turn=1; return {date:dateStr, ghost:v.ghost, state:s, solutions:sol}; }
    }
  }
  return null;
}

function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- audio (generated in code, no files) ---------- */
var actx=null, muted=store.get('muted',false);
function ensureAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume().catch(function(){});
}
function tone(freq,dur,type,vol,delay,slide){
  if(muted||!actx) return;
  var t=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
var sfx={
  place:function(p){ tone(p===1?520:390,0.12,'triangle',0.14); },
  vanish:function(){ tone(320,0.26,'sine',0.08,0.05,-200); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.18,'triangle',0.13,i*0.1); }); },
  lose:function(){ tone(260,0.3,'sawtooth',0.07,0,-120); tone(200,0.35,'sawtooth',0.07,0.2,-90); },
  draw:function(){ tone(300,0.2,'sine',0.1); tone(300,0.2,'sine',0.1,0.22); }
};
document.addEventListener('visibilitychange',function(){
  if(!actx) return;
  if(document.hidden) actx.suspend().catch(function(){}); else if(!muted) actx.resume().catch(function(){});
});
function paintMute(){ $('#muteBtn').textContent = muted?'🔇':'🔊'; }
$('#muteBtn').addEventListener('click',function(){ muted=!muted; store.set('muted',muted); paintMute(); ensureAudio(); hook('onMute',muted); });
paintMute();

/* ---------- toast & modal ---------- */
var toastTimer=0;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; },2200); }
function openModal(title, html, btnText){
  $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; $('#modalClose').textContent=btnText||'OK';
  $('#modal').hidden=false; $('#modalClose').focus();
}
function closeModal(){ $('#modal').hidden=true; }
$('#modalClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('#modal').hidden) closeModal(); });

function showHelp(){
  openModal('How to play',
    '<p>Take turns placing <b style="color:var(--x)">X</b> and <b style="color:var(--o)">O</b>. Get a full line (row, column or diagonal) to win.</p>'+
    '<ul><li><b>3 × 3:</b> get 3 in a row.</li><li><b>5 × 5:</b> get 4 in a row.</li>'+
    '<li><b>Ghost mode:</b> each player keeps at most 3 marks (5 on 5 × 5). Place another and your oldest mark vanishes. Pulsing marks vanish next.</li>'+
    '<li><b>Daily Puzzle:</b> a new position every day. You are X. Find the move that wins in 2 turns, whatever O does.</li>'+
    '<li><b>Themes:</b> win games against the computer to unlock new looks.</li></ul>',
    "Let's play");
  store.set('seenHelp',true);
}
$('#helpBtn').addEventListener('click',showHelp);

function showStats(){
  var g=stats.wins+stats.losses+stats.draws, pct=g?Math.round(100*stats.wins/g):0;
  var row=function(n,k){ var o=stats.lv[k]; return '<tr><td>'+n+'</td><td>'+o.w+'</td><td>'+o.l+'</td><td>'+o.d+'</td></tr>'; };
  openModal('Statistics',
    '<div class="statgrid">'+
      '<div class="stat"><b>'+stats.played+'</b><span>Played</span></div>'+
      '<div class="stat"><b>'+pct+'%</b><span>Win rate</span></div>'+
      '<div class="stat"><b>'+stats.best+'</b><span>Best streak</span></div>'+
      '<div class="stat"><b>'+stats.dailySolved+'</b><span>Puzzles</span></div>'+
      '<div class="stat"><b>'+stats.dailyStreak+'</b><span>Daily streak</span></div>'+
      '<div class="stat"><b>'+stats.dailyBest+'</b><span>Best daily</span></div>'+
    '</div>'+
    '<table class="lv"><tr><th>Vs computer</th><th>Won</th><th>Lost</th><th>Draw</th></tr>'+
      row('Easy','easy')+row('Normal','normal')+row('Hard','hard')+'</table>'+
    '<p class="hint">Stats are saved only on this device.</p>');
}
$('#statsBtn').addEventListener('click',showStats);

/* ---------- themes ---------- */
function applyTheme(){
  if(theme==='neon') document.body.removeAttribute('data-theme'); else document.body.setAttribute('data-theme',theme);
  var meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', theme==='paper'?'#f4eee0':theme==='sunset'?'#3a1640':'#151036');
}
function paintThemes(){
  var next=null;
  document.querySelectorAll('#themeSeg button').forEach(function(b){
    var t=b.dataset.theme, need=THEMES[t], open=stats.wins>=need;
    b.disabled=!open; b.textContent=(open?'':'🔒 ')+b.textContent.replace('🔒 ','');
    b.setAttribute('aria-pressed',String(t===theme));
    if(!open && next===null) next={t:b.textContent.replace('🔒 ',''),n:need-stats.wins};
  });
  $('#themeHint').textContent = next ? ('Win '+next.n+' more game'+(next.n===1?'':'s')+' vs the computer to unlock '+next.t+'.') : 'All themes unlocked.';
}
$('#themeSeg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||b.disabled) return;
  theme=b.dataset.theme; store.set('theme',theme); applyTheme(); paintThemes();
});
if(stats.wins < (THEMES[theme]||0)) theme='neon';
applyTheme(); paintThemes();

/* ---------- menu ---------- */
function maxMarksFor(size){ return size===3?3:5; }
function winLenFor(size){ return size===3?3:4; }
function paintMenu(){
  document.querySelectorAll('.seg[data-key]').forEach(function(seg){
    var key=seg.dataset.key;
    seg.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(String(cfg[key])===b.dataset.val)); });
  });
  $('#levelField').hidden = cfg.opp!=='cpu';
  var w=winLenFor(cfg.size), m=maxMarksFor(cfg.size);
  $('#rules').textContent = 'Get ' + w + ' in a row on a ' + cfg.size + '×' + cfg.size + ' board.' +
    (cfg.ghost ? ' Ghost mode: each player keeps at most ' + m + ' marks. Place another and your oldest one vanishes.' : '') +
    (cfg.opp==='cpu' && cfg.level==='hard' ? ' Hard plays perfectly in classic 3×3.' : '');
  var solved = stats.dailyLast===todayStr();
  $('#dailySub').textContent = solved ? ('Solved today ✓  ·  Streak '+stats.dailyStreak) :
    ('New puzzle today'+(stats.dailyStreak && stats.dailyLast===yesterdayStr() ? '  ·  Keep your '+stats.dailyStreak+'-day streak' : ''));
}
document.querySelectorAll('.seg[data-key]').forEach(function(seg){
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var key=seg.dataset.key, v=b.dataset.val;
    cfg[key] = (key==='size') ? Number(v) : (key==='ghost') ? (v==='true') : v;
    store.set('cfg',cfg); paintMenu();
  });
});
paintMenu();

/* ---------- board ---------- */
var boardEl=$('#board');
function label(i,v){ var n=state.size; return 'Row '+((i/n|0)+1)+', column '+(i%n+1)+', '+(v===1?'X':v===2?'O':'empty'); }
function markSVG(p){
  return p===1
    ? '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mark mx" pathLength="1" d="M22 22 L78 78"/><path class="mark mx" pathLength="1" d="M78 22 L22 78"/></svg>'
    : '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="mark mo" pathLength="1" cx="50" cy="50" r="30"/></svg>';
}
function buildBoard(){
  var n=state.size;
  boardEl.style.setProperty('--n',n); boardEl.style.setProperty('--gap', n===3?'10px':'7px');
  boardEl.innerHTML=''; cells=[];
  for(var i=0;i<n*n;i++){
    var b=document.createElement('button'); b.type='button'; b.className='cell'; b._p=0;
    b.setAttribute('aria-label',label(i,0));
    (function(idx){ b.addEventListener('click',function(){ onCell(idx); }); })(i);
    boardEl.appendChild(b); cells.push(b);
  }
}
function isGhost(){ return state && state.maxMarks!==Infinity; }
function render(opts){
  opts=opts||{};
  var s=state, fading={};
  if(isGhost() && !over){ for(var qi=0;qi<2;qi++) if(s.q[qi].length>=s.maxMarks) fading[s.q[qi][0]]=true; }
  cells.forEach(function(el,i){
    var v=s.board[i];
    if(el._p!==v){
      var was=el._p; el._p=v; el.classList.remove('out','pop');
      if(v){ el.innerHTML=markSVG(v); el.classList.add('filled','pop'); }
      else if(was && opts.fadeOut===i){
        el.classList.add('out'); el.classList.remove('filled');
        setTimeout(function(){ if(el._p===0){ el.innerHTML=''; el.classList.remove('out'); } },400);
      } else { el.innerHTML=''; el.classList.remove('filled'); }
      el.setAttribute('aria-label',label(i,v));
    }
    el.classList.toggle('fading', !!fading[i]);
    el.classList.toggle('win', !!(winSet && winSet.has(i)));
  });
}
function paintScores(){
  $('#scorebar').hidden = dailyMode;
  $('#scX').textContent=scores[1]; $('#scO').textContent=scores[2]; $('#scD').textContent=scores.d;
  $('#nmX').textContent = cfg.opp==='cpu' ? 'You (X)' : 'Player X';
  $('#nmO').textContent = cfg.opp==='cpu' ? 'Computer (O)' : 'Player O';
  $('#tileX').classList.toggle('active', !over && state && state.turn===1);
  $('#tileO').classList.toggle('active', !over && state && state.turn===2);
  $('#streak').textContent = dailyMode ? ('Daily streak: '+stats.dailyStreak) :
    (cfg.opp==='cpu' ? ('Win streak: '+streak+'  ·  Best: '+stats.best) : '');
}
function setStatus(t){ $('#status').textContent=t; }
function turnStatus(){
  if(dailyMode) setStatus(state.turn===HUMAN ? (xMoves===0?'You are X. Win in 2 moves.':'Now finish it!') : 'O is defending…');
  else if(cfg.opp==='cpu') setStatus(state.turn===HUMAN ? 'Your turn (X)' : 'Computer is thinking…');
  else setStatus((state.turn===1?'X':'O')+"'s turn");
  paintScores();
}
function resetButtons(){ $('#againBtn').hidden=true; $('#shareBtn').hidden=true; $('#restartBtn').hidden=false; }

/* ---------- normal game ---------- */
function startGame(){
  token++; over=false; locked=false; winSet=null; dailyMode=false; xMoves=0;
  var size=cfg.size;
  state=createState(size, winLenFor(size), cfg.ghost?maxMarksFor(size):Infinity);
  state.turn = (round%2===0) ? 1 : 2;
  resetButtons(); $('#restartBtn').textContent='Restart';
  $('#legend').textContent = cfg.ghost ? 'Pulsing marks are the next to vanish.' : '';
  buildBoard(); render(); turnStatus(); hook('onGameStart',{mode:'game',size:size,ghost:cfg.ghost,opp:cfg.opp});
  maybeCpu();
}
function onCell(i){
  if(over||locked||state.board[i]) return;
  if((dailyMode || cfg.opp==='cpu') && state.turn!==HUMAN) return;
  ensureAudio(); play(i);
}
function play(i){
  var p=state.turn, removed=doMove(state,i);
  if(p===1) xMoves++;
  sfx.place(p); if(removed>=0) sfx.vanish();
  var wl=winLine(state,i,p);
  if(wl){ over=true; winSet=new Set(wl); render({fadeOut:removed}); return dailyMode ? dailyEnd(p===1) : finish(p); }
  if(dailyMode && p===1 && xMoves>=2){ over=true; render({fadeOut:removed}); return dailyEnd(false); }
  if(!isGhost() && emptyCells(state).length===0){ over=true; render({fadeOut:removed}); return dailyMode ? dailyEnd(false) : finish(0); }
  state.turn=3-p; render({fadeOut:removed}); turnStatus(); maybeCpu();
}
function maybeCpu(){
  if(over || state.turn===HUMAN) return;
  if(!dailyMode && cfg.opp!=='cpu') return;
  locked=true; var my=token;
  setTimeout(function(){
    if(my!==token || over) return;
    var m=chooseMove(state, dailyMode ? 'defend' : cfg.level);
    locked=false; play(m);
  }, 380);
}
function finish(winner){
  if(winner) scores[winner]++; else scores.d++;
  stats.played++;
  if(cfg.opp==='cpu'){
    var lv=stats.lv[cfg.level];
    if(winner===HUMAN){ streak++; stats.wins++; lv.w++; if(streak>stats.best) stats.best=streak; }
    else { streak=0; if(winner){ stats.losses++; lv.l++; } else { stats.draws++; lv.d++; } }
  }
  var before=unlockedCount(); saveStats(); var after=unlockedCount();
  if(cfg.opp==='cpu') setStatus(winner===HUMAN?'You win! 🎉':winner?'Computer wins':'Draw');
  else setStatus(winner?(winner===1?'X':'O')+' wins! 🎉':'Draw');
  if(winner){ if(cfg.opp==='cpu'&&winner!==HUMAN) sfx.lose(); else sfx.win(); } else sfx.draw();
  paintScores(); paintThemes();
  if(after>before) setTimeout(function(){ toast('New theme unlocked! Choose it in the menu.'); },700);
  $('#againBtn').hidden=false; $('#restartBtn').hidden=true;
  hook('onGameEnd',{mode:'game',winner:winner,size:cfg.size,ghost:cfg.ghost,opp:cfg.opp,level:cfg.level});
}
function unlockedCount(){ var c=0; for(var t in THEMES) if(stats.wins>=THEMES[t]) c++; return c; }

/* ---------- daily puzzle ---------- */
function getDaily(){
  var d=todayStr();
  if(!daily || daily.date!==d) daily=makeDaily(d);
  return daily;
}
function startDaily(){
  var dz=getDaily();
  if(!dz){ toast('Daily puzzle unavailable today.'); return; }
  token++; over=false; locked=false; winSet=null; dailyMode=true; xMoves=0; dailyResult=null;
  state=cloneState(dz.state); state.turn=1;
  resetButtons(); $('#restartBtn').textContent='Retry';
  var n=state.size;
  $('#legend').textContent = n+'×'+n+', '+state.winLen+' in a row' + (dz.ghost?', Ghost mode (pulsing marks vanish next)':'') + '. Daily puzzle '+dz.date+'.';
  $('#menu').hidden=true; $('#game').hidden=false;
  buildBoard(); render(); turnStatus();
  hook('onGameStart',{mode:'daily',size:n,ghost:dz.ghost});
}
function dailyEnd(won){
  var d=todayStr(), first=false;
  if(won){
    sfx.win(); setStatus('Solved! 🎉');
    if(stats.dailyLast!==d){
      first=true;
      stats.dailyStreak = (stats.dailyLast===yesterdayStr()) ? stats.dailyStreak+1 : 1;
      stats.dailyLast=d; stats.dailySolved++;
      if(stats.dailyStreak>stats.dailyBest) stats.dailyBest=stats.dailyStreak;
      saveStats();
    }
    dailyResult='solved';
    $('#shareBtn').hidden=false;
  } else {
    sfx.lose(); setStatus('Not quite. Try again!');
    dailyResult='retry';
  }
  paintScores(); paintMenu();
  if(won && first) setTimeout(function(){ toast('Daily streak: '+stats.dailyStreak+' 🔥'); },600);
  hook('onGameEnd',{mode:'daily',won:won});
}
function shareText(){
  return 'Ghostmarks Daily Puzzle '+todayStr()+': solved ✅ Streak '+stats.dailyStreak+' 🔥\nCan you find the winning move?';
}
$('#shareBtn').addEventListener('click',function(){
  var text=shareText();
  if(navigator.share){ navigator.share({text:text}).catch(function(){}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Copied! Paste it to your friends.'); },function(){ toast(text); });
  } else toast(text);
});

/* ---------- navigation ---------- */
function showMenu(){ token++; dailyMode=false; $('#game').hidden=true; $('#menu').hidden=false; paintMenu(); paintThemes(); }
$('#startBtn').addEventListener('click',function(){
  ensureAudio(); scores={1:0,2:0,d:0}; streak=0; round=0;
  $('#menu').hidden=true; $('#game').hidden=false; startGame();
});
$('#dailyBtn').addEventListener('click',function(){ ensureAudio(); startDaily(); });
$('#againBtn').addEventListener('click',function(){ round++; startGame(); });
$('#restartBtn').addEventListener('click',function(){ if(dailyMode) startDaily(); else startGame(); });
$('#menuBtn').addEventListener('click',showMenu);

if(!store.get('seenHelp',false)) setTimeout(showHelp,300);
})();
